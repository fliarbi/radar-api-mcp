name: Private preview checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    services:
      # Disposable ledger for the multi-host account-mode tests; no data leaves the runner.
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: radar_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RADAR_TEST_POSTGRES_URL: postgresql://postgres:ci-only@localhost:5432/radar_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check radar_api tests scripts
      - run: pytest
      - run: python scripts/e2e_account_mode.py --workers 2
      - run: python scripts/e2e_account_mode.py --workers 4 --database-url "$RADAR_TEST_POSTGRES_URL"
      - run: python scripts/check_docs.py
      - run: python -m build
# No deployment, GitHub Pages, package upload, visibility change or release job.
